<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — GoalForge AI</title>
  <meta name="description" content="เข้าสู่ระบบ GoalForge AI แพลตฟอร์มตั้งเป้าหมายและแตกภารกิจรายวันด้วย AI">
  
  <link rel="stylesheet" href="css/main.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/roadmap.css?v=5">
  
  <style>
    /* Auth Page Layout */
    body {
      min-height: 100vh;
      background: var(--bg-body);
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.35;
    }
    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, hsl(238, 82%, 59%), transparent 70%);
      top: -120px;
      right: -100px;
    }
    body::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, hsl(158, 75%, 42%), transparent 70%);
      bottom: -100px;
      left: -80px;
    }

    /* Brand Logo */
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .auth-logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 24px var(--primary-glow);
      margin-bottom: 1rem;
    }

    /* Container */
    .auth-container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
      position: relative;
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Auth Box */
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 12px 36px rgba(0,0,0,0.06);
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-body);
      padding: 0.35rem;
      border-radius: 14px;
      margin-bottom: 2rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .auth-tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* Alerts */
    .auth-alert {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-alert.error {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .auth-alert.success {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    /* Social Login */
    .auth-google-btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 1.5rem;
    }
    .auth-google-btn:hover {
      background: var(--bg-subtle);
    }
    .auth-google-btn img {
      width: 20px;
      height: 20px;
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }
    .auth-divider:not(:empty)::before { margin-right: .5em; }
    .auth-divider:not(:empty)::after { margin-left: .5em; }

    /* Form Fields */
    .auth-field {
      margin-bottom: 1.25rem;
    }
    .auth-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .auth-input-wrap {
      position: relative;
    }
    .auth-input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .auth-input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.8rem;
      background: var(--bg-input);
      border: 1.5px solid var(--border-medium);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* Submit Button */
    .auth-submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <button id="auth-theme-btn" style="position: absolute; top: 1rem; right: 1rem; background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 0.5rem 1rem; border-radius: 20px; color: var(--text-main); font-weight: 600; cursor: pointer;">🌙</button>

  <div class="auth-container">

    <div class="auth-box">
      <div class="auth-brand">
        <div class="auth-logo-icon">🎯</div>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--text-main);">GoalForge <span style="background: linear-gradient(135deg, var(--primary), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI</span></h1>
        <p style="color: var(--text-muted); font-size: 1rem;">แตกเป้าหมายใหญ่ให้กลายเป็นภารกิจรายวันด้วย AI</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-panel="login">🔑 เข้าสู่ระบบ</button>
        <button class="auth-tab-btn" data-panel="register">✨ สมัครสมาชิก</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="auth-panel active" id="panel-login">
        <div class="auth-alert error" id="login-error">⚠️ <span id="login-error-text"></span></div>
  
        <button type="button" class="auth-google-btn btn-google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
          เข้าสู่ระบบด้วย Google
        </button>
  
        <div class="auth-divider">หรือใช้อีเมล</div>
  
        <form id="login-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="login-email">อีเมล</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">📧</span>
              <input type="email" id="login-email" class="auth-input" placeholder="your@email.com" required autocomplete="email">
            </div>
          </div>
  
          <div class="auth-field">
            <label class="auth-label" for="login-password">รหัสผ่าน</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>
  
          <button type="submit" class="auth-submit-btn" id="login-submit-btn">
            🚀 เข้าสู่ระบบ
          </button>
        </form>
  
        <div class="auth-divider" style="margin-top: 2rem;"></div>
        <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          ยังไม่มีบัญชีใช่ไหม? <a href="#" id="goto-register" style="color: var(--primary); font-weight: 500; text-decoration: none;">สมัครสมาชิกเลย</a>
        </p>
      </div>
  
      <!-- REGISTER PANEL -->
      <div class="auth-panel" id="panel-register">
        <div class="auth-alert error" id="register-error">⚠️ <span id="register-error-text"></span></div>
        <div class="auth-alert success" id="register-success">✅ <span id="register-success-text"></span></div>
  
        <button type="button" class="auth-google-btn btn-google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
          สมัครสมาชิกด้วย Google
        </button>
  
        <div class="auth-divider">หรือใช้อีเมล</div>
  
        <form id="register-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="reg-name">ชื่อของคุณ</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">👤</span>
              <input type="text" id="reg-name" class="auth-input" placeholder="เช่น สมชาย ใจดี" required autocomplete="name">
            </div>
          </div>
  
          <div class="auth-field">
            <label class="auth-label" for="reg-email">อีเมล</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">📧</span>
              <input type="email" id="reg-email" class="auth-input" placeholder="your@email.com" required autocomplete="email">
            </div>
          </div>
  
          <div class="auth-field">
            <label class="auth-label" for="reg-password">รหัสผ่าน <span style="color: var(--text-muted); font-weight: 400;">(อย่างน้อย 6 ตัวอักษร)</span></label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input type="password" id="reg-password" class="auth-input" placeholder="••••••••" required autocomplete="new-password" minlength="6">
            </div>
          </div>
  
          <div class="auth-field">
            <label class="auth-label" for="reg-confirm">ยืนยันรหัสผ่าน</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input type="password" id="reg-confirm" class="auth-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
          </div>
  
          <button type="submit" class="auth-submit-btn" id="register-submit-btn">
            ✨ สร้างบัญชีใหม่
          </button>
        </form>
  
        <div class="auth-divider" style="margin-top: 2rem;"></div>
        <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          มีบัญชีอยู่แล้ว? <a href="#" id="goto-login" style="color: var(--primary); font-weight: 500; text-decoration: none;">เข้าสู่ระบบ</a>
        </p>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>

  <script>
    if (AuthService.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const savedTheme = localStorage.getItem('goalforge_auth_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const themeBtn = document.getElementById('auth-theme-btn');
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('goalforge_auth_theme', next);
      themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function switchPanel(panelName) {
      document.querySelectorAll('.auth-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-panel') === panelName);
      });
      document.querySelectorAll('.auth-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === `panel-${panelName}`);
      });
    }

    document.querySelectorAll('.auth-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchPanel(btn.getAttribute('data-panel')));
    });

    document.getElementById('goto-register').addEventListener('click', (e) => {
      e.preventDefault();
      switchPanel('register');
    });

    document.getElementById('goto-login').addEventListener('click', (e) => {
      e.preventDefault();
      switchPanel('login');
    });

    function showAlert(elId, message) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.style.display = 'flex';
      const span = el.querySelector('span');
      if (span) span.textContent = message;
    }

    function hideAlert(elId) {
      const el = document.getElementById(elId);
      if (el) el.style.display = 'none';
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert('login-error');

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showAlert('login-error', 'กรุณากรอกอีเมลและรหัสผ่าน');
        return;
      }

      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `กำลังเข้าสู่ระบบ...`;

      setTimeout(async () => {
        const result = await AuthService.login({ email, password });
        if (result.success) {
          btn.innerHTML = '✅ เข้าสู่ระบบสำเร็จ!';
          setTimeout(() => window.location.href = 'index.html', 600);
        } else {
          showAlert('login-error', result.error);
          btn.disabled = false;
          btn.innerHTML = '🚀 เข้าสู่ระบบ';
        }
      }, 400);
    });

    // Register
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert('register-error');
      hideAlert('register-success');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (!name || !email || !password || !confirm) {
        showAlert('register-error', 'กรุณากรอกข้อมูลให้ครบทุกช่อง');
        return;
      }
      if (password !== confirm) {
        showAlert('register-error', 'รหัสผ่านไม่ตรงกัน');
        return;
      }

      const btn = document.getElementById('register-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `กำลังสร้างบัญชี...`;

      setTimeout(async () => {
        const result = await AuthService.register({ name, email, password });
        if (result.success) {
          btn.innerHTML = '✅ สมัครสมาชิกสำเร็จ!';
          setTimeout(() => window.location.href = 'index.html', 700);
        } else {
          showAlert('register-error', result.error);
          btn.disabled = false;
          btn.innerHTML = '✨ สร้างบัญชีใหม่';
        }
      }, 400);
    });

    // Google Login
    document.querySelectorAll('.btn-google-login').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.innerHTML = `กำลังเชื่อมต่อกับ Google...`;
        
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithRedirect(provider);
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      firebase.auth().getRedirectResult()
        .then(async (result) => {
          if (result && result.user) {
            const firebaseUser = result.user;
            const email = firebaseUser.email;
            
            try {
              const userRef = window.db.collection('users').where('email', '==', email.toLowerCase());
              const snapshot = await userRef.get();
              let appUser = null;
              
              if (snapshot.empty) {
                appUser = {
                  id: 'google_' + Date.now(),
                  name: firebaseUser.displayName || email.split('@')[0],
                  email: email.toLowerCase(),
                  avatar: firebaseUser.photoURL || null,
                  createdAt: new Date().toISOString()
                };
                await window.db.collection('users').doc(appUser.id).set(appUser);
              } else {
                appUser = snapshot.docs[0].data();
                if (!appUser.avatar && firebaseUser.photoURL) {
                  appUser.avatar = firebaseUser.photoURL;
                  await window.db.collection('users').doc(appUser.id).update({ avatar: appUser.avatar });
                }
              }
              
              AuthService.createSession(appUser);
              window.location.href = 'index.html';
            } catch (err) {
              console.error(err);
              showAlert('login-error', 'เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล');
            }
          }
        })
        .catch((error) => {
          console.error(error);
          showAlert('login-error', 'เกิดข้อผิดพลาดในการเข้าสู่ระบบด้วย Google');
        });
    });
  </script>
</body>
</html>
